name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: ruff check segment_lidar tests scripts
      - run: ruff format --check segment_lidar tests scripts
      - run: pytest -q
      - run: python -c "from PIL import Image; image = Image.open('assets/workflow.gif'); assert image.n_frames > 20"
      - run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t segment-lidar:test .
      - run: docker run --rm segment-lidar:test python -c "import segment_lidar"
